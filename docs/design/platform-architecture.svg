<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1470" viewBox="0 0 1800 1470" role="img" aria-labelledby="title description">
<title id="title">Possible multi-carrier shipping platform architecture</title>
<desc id="description">Clients call an API gateway and domain microservices. Courier and ecommerce adapters make outbound API calls. Authenticated webhooks enter separate queues and domain consumers, which update isolated databases. Metrics, logs, and traces use a separate observability pipeline. Only rate aggregation is implemented in the demo.</desc>
