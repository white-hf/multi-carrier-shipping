<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1010" viewBox="0 0 1500 1010" role="img" aria-labelledby="title desc">
<title id="title">Shipping demo system architecture</title>
<desc id="desc">A browser connects to one Spring Boot application containing HTTP endpoints, Quote, Booking and Reconciliation modules, provider integration and shared infrastructure. Side panels show implemented logging and metrics. A local SQLite file has module-owned tables. A separate external provider performs carrier aggregation, shipment creation and label retrieval. Lines show structural connections, not request sequence.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b4d}.title{font-size:25px;font-weight:700}.heading{font-size:18px;font-weight:700;letter-spacing:.6px}.label{font-size:21px;font-weight:600}.detail{font-size:17px;fill:#475569}.small{font-size:15px;fill:#475569}.line{fill:none;stroke:#7b8fa8;stroke-width:2;stroke-linejoin:round}</style>
<rect width="1500" height="1010" fill="#fff"/>

