<text x="1130" y="866" text-anchor="middle" class="label">Multi-Carrier Aggregation</text>
<text x="1130" y="900" text-anchor="middle" class="detail">Rates · Shipment Creation · Label Retrieval</text>
<text x="1130" y="934" text-anchor="middle" class="small">No application-side carrier fan-out on the default path</text>
<text x="40" y="992" text-anchor="start" class="small">Lines indicate structural connections, not execution order. Business modules use published contracts; shared code has no business dependencies.</text>
