server:
  address: 127.0.0.1
  port: 8080
  shutdown: graceful
  tomcat:
    threads:
      max: 64
    accept-count: 32
    max-connections: 128

spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    servlet:
      load-on-startup: 1
  application:
    name: multi-courier-aggregation-service
  main:
    web-application-type: servlet

shipping:
  market:
    default-country: CA
    comparison-currency: CAD
    supported-carriers: ${SHIPPING_MARKET_SUPPORTED_CARRIERS:Canada Post,Purolator,FedEx,UPS,DHL Express,Canpar,Loomis Express}
    postal-code-patterns:
      CA: '[A-Z]\d[A-Z]\d[A-Z]\d'
  default-user-id: ${SHIPPING_DEFAULT_USER_ID:guest-user}
  database-path: ${SHIPPING_DATABASE_PATH:./data/shipping.db}
  auth:
    token-secret: ${SHIPPING_AUTH_TOKEN_SECRET:}
    token-ttl: ${SHIPPING_AUTH_TOKEN_TTL:2h}
    users:
      - username: ${SHIPPING_AUTH_USERNAME:}
        password: ${SHIPPING_AUTH_PASSWORD:}
        password-hash: ${SHIPPING_AUTH_PASSWORD_HASH:}
        user-id: ${SHIPPING_AUTH_USER_ID:user-admin}
        display-name: ${SHIPPING_AUTH_DISPLAY_NAME:Shipping Operator}
    max-failed-attempts: ${SHIPPING_AUTH_MAX_FAILED_ATTEMPTS:5}
    failure-window: 5m
    lockout-duration: ${SHIPPING_AUTH_LOCKOUT_DURATION:15m}
    login-per-second: 5
    max-entries: 4096
    quotes-per-minute: ${SHIPPING_AUTH_QUOTES_PER_MINUTE:10}
    bookings-per-minute: ${SHIPPING_AUTH_BOOKINGS_PER_MINUTE:5}
    labels-per-minute: ${SHIPPING_AUTH_LABELS_PER_MINUTE:20}
  # Defaults -> named template -> dependency overrides. States/resources are never shared across dependencies.
  outbound:
    defaults:
      timeout: 30s
      connect-timeout: 3s
      concurrency: 8
      window-size: 10
      minimum-calls: 5
      failure-rate: 50
      open-duration: 10s
    templates:
      slow-provider:
        timeout: 90s
    dependencies:
      sandbox:
        template: slow-provider
        timeout: ${SHIPPING_PROVIDER_RATE_TIMEOUT:90s}
        concurrency: 8
  # Operation timeouts below are caller budgets, capped by the outbound dependency policy.
  provider:
    base-url: ${SHIPPING_PROVIDER_BASE_URL:}
    username: ${SHIPPING_PROVIDER_USERNAME:}
    password: ${SHIPPING_PROVIDER_PASSWORD:}
    provider-id: sandbox
    account-alias: local-account
    shipments-path: ${SHIPPING_PROVIDER_SHIPMENTS_PATH:/rest/shipments}
    rate-timeout: ${SHIPPING_PROVIDER_RATE_TIMEOUT:90s}
    create-timeout: ${SHIPPING_PROVIDER_CREATE_TIMEOUT:60s}
    read-timeout: ${SHIPPING_PROVIDER_READ_TIMEOUT:30s}
    collection-seconds: 30
    quote-lifetime-seconds: 780
    label-hosts: ${SHIPPING_PROVIDER_LABEL_HOSTS:}

management:
  server:
    address: 127.0.0.1
    port: 9091
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    distribution:
      percentiles-histogram:
        shipping.aggregation.latency: true
        shipping.carrier.transport.latency: true
        shipping.outbound.duration: true

logging:
  file:
    name: ${SHIPPING_LOG_FILE:./logs/shipping.log}
  logback:
    rollingpolicy:
      file-name-pattern: '${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz'
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 1GB
      clean-history-on-start: true
  pattern:
    level: '%5p [requestId=%X{requestId}]'
