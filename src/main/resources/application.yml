server:
  address: 127.0.0.1
  port: 8080
  shutdown: graceful
  tomcat:
    threads:
      max: 64
    accept-count: 32
    max-connections: 128
spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    servlet:
      load-on-startup: 1
  application:
    name: multi-courier-aggregation-service
  main:
    web-application-type: servlet
shipping:
  quote:
    enabled: false
resilience4j:
  circuitbreaker:
    configs:
      default:
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 200ms
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        waitDurationInOpenState: 10s
        ignoreExceptions:
          - java.lang.InterruptedException
  bulkhead:
    configs:
      default:
        maxConcurrentCalls: 8
        maxWaitDuration: 0
management:
  server:
    address: 127.0.0.1
    port: 9091
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    distribution:
      percentiles-histogram:
        shipping.aggregation.latency: true
        shipping.carrier.transport.latency: true
logging:
  file:
    name: ${SHIPPING_LOG_FILE:./logs/shipping.log}
  logback:
    rollingpolicy:
      file-name-pattern: '${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz'
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 1GB
      clean-history-on-start: true
  pattern:
    level: '%5p [requestId=%X{requestId}]'
